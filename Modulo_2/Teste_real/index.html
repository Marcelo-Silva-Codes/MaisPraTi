<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de compras</title>
</head>
<body>
    <h1>Carrinho de compras</h1>
    <button onclick="adicionarItem('Camiseta', 49.90)">Adiconar Camiseta (R$ 49,90)</button>
    <button onclick="adicionarItem('Calça', 89.90)">Adiconar Calça (R$ 89,90)</button>
    <button onclick="limparCarrinho()">Limpar o carrinho</button>
    <button onclick="atualizarTela()">Atutalizar</button>
    <p>Itens no carrinho: <span id="qtd">
        0
    </span></p>
    <p>Total: R$<span id="total">
        0.00
    </span></p>

    <script src="./carrinho.js"></script>
    <script>
        function atualizarTela(){
            document.getElementById("qtd").textContent = contarItens()
            document.getElementById("total").textContent = calcularTotal().toFixed(2)
        }
    </script>
</body>
</html>
