    <div id="form-login">
        <form>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome">
            <label for="email">Email:</label>
            <input type="email" name="email" placeholder="Digite seu email">
            <input type="submit" value="Enviar">
            <label for="mensagem">Mensagem:</label>
            <input type="text" name="mensagem" placeholder="Digite sua mensagem">
            <label for="data">Data:</label>
            <input type="date" name="data">
            <label for="cor">Cor favorita:</label>
            <input type="color" name="cor">
            <label for="numero">Número:</label>
            <input type="number" name="numero" placeholder="Digite um número">
            <label for="senha">Senha:</label>
            <input type="password" name="senha" placeholder="Digite sua senha">
            <label for="arquivo">Arquivo:</label>
            <input type="file" name="arquivo" placeholder="Escolha um arquivo">
            <label for="url">URL:</label>
            <input type="url" name="url" placeholder="Digite uma URL">
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" placeholder="Digite seu telefone">
            <label for="range">Range:</label>
            <input type="range" name="range" min="0" max="100">
            <label for="checkbox">Checkbox:</label>
            <input type="checkbox" name="checkbox">
            <label for="radio">Radio:</label>  
            <input type="radio" name="radio" value="opcao1"> Opção 1
            <input type="radio" name="radio" value="opcao2"> Opção 2
            <label for="select">Select:</label>
            <select name="select">
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
                <option value="opcao3">Opção 3</option>
            </select>
            <label for="textarea">Textarea:</label>
            <textarea name="textarea" placeholder="Digite sua mensagem"></textarea>
            <label for="hidden">Hidden:</label>
            <input type="hidden" name="hidden" value="valor oculto">
            <label for="reset">Reset:</label>
            <input type="reset" value="Resetar">
        </form>
    </div>
